<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>오늘의 말씀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Gothic+A1:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #26221d;
    --ink-soft: #5f574d;
    --brass: #9a6f34;
    /* 말씀이 하늘에서 시작하는 높이입니다. 값을 키우면 아래로 내려갑니다. */
    --verse-top: 8%;
    /* 그림의 가로/세로 비율입니다. 그림을 새로 그리면 (가로 / 세로)로 바꾸세요. */
    --art-ratio: 1023 / 1537;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  .stage {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background: linear-gradient(to bottom, #d7e6f0 0%, #eae7dd 55%, #efe6d4 100%);
  }

  /* 그림 비율로 고정된 틀입니다. 그림이 없어도 폭이 유지됩니다. */
  .art {
    position: relative;
    aspect-ratio: var(--art-ratio);
    width: min(100%, calc(100dvh * (var(--art-ratio))));
    container-type: inline-size;
    line-height: 0;
  }
  .art .bg { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* 하늘 위에 겹쳐지는 말씀 영역 */
  .textwrap {
    position: absolute;
    top: var(--verse-top);
    left: 50%;
    transform: translateX(-50%);
    width: 86%;
    line-height: normal;
    text-align: center;
  }

  .eyebrow { opacity: 0; animation: rise 0.9s ease 0.15s forwards; }
  .eyebrow .label {
    font-size: clamp(0.62rem, 3cqw, 0.82rem);
    font-weight: 500; letter-spacing: 0.4em; text-indent: 0.4em;
    color: var(--brass); text-shadow: 0 1px 8px rgba(255,255,255,0.7);
  }
  .eyebrow .date {
    margin-top: 0.5rem;
    font-size: clamp(0.64rem, 3cqw, 0.82rem);
    font-weight: 300; letter-spacing: 0.05em;
    color: var(--ink-soft); text-shadow: 0 1px 8px rgba(255,255,255,0.7);
  }

  .verse { margin-top: 4.5cqw; opacity: 0; animation: rise 1.1s ease 0.4s forwards; }
  .verse p {
    font-family: "Nanum Myeongjo", serif;
    font-weight: 400;
    font-size: clamp(1.3rem, 6.6cqw, 2.05rem); /* 짧은 구절 */
    line-height: 1.75;
    color: var(--ink);
    word-break: keep-all;
    text-shadow: 0 1px 2px rgba(255,255,255,0.65), 0 2px 18px rgba(255,255,255,0.75);
  }
  /* 구절 길이에 따라 글자 크기 자동 조절 */
  .verse.len-m  p { font-size: clamp(1.08rem, 5.4cqw, 1.68rem); line-height: 1.72; }
  .verse.len-l  p { font-size: clamp(0.94rem, 4.6cqw, 1.4rem);  line-height: 1.7; }
  .verse.len-xl p { font-size: clamp(0.82rem, 3.9cqw, 1.18rem); line-height: 1.66; }
  .verse p .line { display: block; text-wrap: balance; }

  .verse .ref {
    display: inline-block;
    margin-top: 1.3rem; padding-top: 0.95rem; position: relative;
    font-family: "Gothic A1", sans-serif;
    font-size: clamp(0.8rem, 3.4cqw, 0.95rem);
    font-weight: 500; letter-spacing: 0.05em;
    color: var(--brass); text-shadow: 0 1px 8px rgba(255,255,255,0.75);
  }
  .verse .ref::before {
    content: ""; position: absolute; top: 0; left: 50%;
    transform: translateX(-50%); width: 2rem; height: 1px;
    background: var(--brass); opacity: 0.6;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(12px);} to { opacity:1; transform: translateY(0);} }
  @media (prefers-reduced-motion: reduce) { .eyebrow, .verse { animation: none; opacity: 1; } }
</style>
</head>
<body>

  <div class="stage">
    <div class="art">
      <img class="bg" src="background.png" alt="" onerror="this.style.display='none'"><!-- jpg면 background.jpg 로 -->
      <div class="textwrap">
        <div class="eyebrow">
          <div class="label">오늘의 말씀</div>
          <div class="date" id="date"></div>
        </div>
        <main class="verse" id="verse">
          <p id="text"></p>
          <span class="ref" id="ref"></span>
        </main>
      </div>
    </div>
  </div>

    { t: "이러므로 너희가 더욱 힘써 너희 믿음에 덕을, 덕에 지식을,", r: "베드로후서 1:5" },

    { t: "우리가 사랑함은 그가 먼저 우리를 사랑하셨음이라", r: "요한일서 4:19" },

    { t: "보라, 아버지께서 어떠한 사랑을 우리에게 주사 하나님의 자녀라 일컬음을 얻게 하셨는고 우리가 그러하도다 그러므로 세상이 우리를 알지 못함은 그를 알지 못함이니라", r: "요한일서 3:1" },
    { t: "사랑하는 자들아 우리가 서로 사랑하자 사랑은 하나님께 속한 것이니 사랑하는 자마다 하나님께로 나서 하나님을 알고", r: "요한일서 4:7" },

    { t: "이는 보좌 가운데 계신 어린 양이 저희의 목자가 되사 생명수 샘으로 인도하시고 하나님께서 저희 눈에서 모든 눈물을 씻어 주실 것임이러라", r: "요한계시록 7:17" },
  ];

  // ── 특정 날짜 고정 말씀 (모임 등) ──
  // "YYYY-MM-DD": { t: "본문", r: "출처" } 형식으로 추가하면 그 날은 이 말씀이 뜹니다.
  const OVERRIDES = {
    "2026-08-29": { t: "좋은 것으로 네 소원을 만족케 하사 네 청춘으로 독수리 같이 새롭게 하시는도다", r: "시편 103:5" }
  };

  // ── 날짜 기준 선택 (하루 동안 동일, 매일 변경, 1년 주기) ──
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  const y = now.getFullYear();
  const mo = String(now.getMonth() + 1).padStart(2, "0");
  const da = String(now.getDate()).padStart(2, "0");
  const todayKey = y + "-" + mo + "-" + da;
  const pick = OVERRIDES[todayKey] || VERSES[dayOfYear % VERSES.length];

  const lines = Array.isArray(pick.t) ? pick.t : [pick.t];
  const textEl = document.getElementById("text");
  textEl.innerHTML = "";
  lines.forEach(function (line) {
    const s = document.createElement("span");
    s.className = "line";
    s.textContent = line;
    textEl.appendChild(s);
  });

  // 길이에 따라 글자 크기 단계 지정
  const total = lines.join(" ").length;
  const verseEl = document.getElementById("verse");
  if (total > 110) verseEl.classList.add("len-xl");
  else if (total > 75) verseEl.classList.add("len-l");
  else if (total > 40) verseEl.classList.add("len-m");

  document.getElementById("ref").textContent = pick.r;
  document.getElementById("date").textContent =
    now.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
</script>
