<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>오늘의 말씀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Gothic+A1:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #26221d;
    --ink-soft: #6b6157;
    --brass: #a67c3d;
    --paper-top: #f6f1e7;
    --paper-bottom: #ece3d2;
    --hair: rgba(38, 34, 29, 0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: calc(env(safe-area-inset-top) + 3.5rem) 1.6rem
             calc(env(safe-area-inset-bottom) + 2.2rem);
    background: linear-gradient(170deg, var(--paper-top) 0%, var(--paper-bottom) 100%);
    color: var(--ink);
    font-family: "Gothic A1", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* 상단 라벨 */
  .eyebrow {
    text-align: center;
    opacity: 0;
    animation: rise 0.9s ease 0.1s forwards;
  }
  .eyebrow .label {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.42em;
    color: var(--brass);
    text-indent: 0.42em;
  }
  .eyebrow .date {
    margin-top: 0.55rem;
    font-size: 0.8rem;
    font-weight: 300;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }

  /* 말씀 본문 */
  .verse {
    max-width: 30rem;
    text-align: center;
    opacity: 0;
    animation: rise 1.1s ease 0.35s forwards;
  }
  .verse p {
    font-family: "Nanum Myeongjo", serif;
    font-weight: 400;
    font-size: clamp(1.5rem, 6.4vw, 2rem);
    line-height: 1.78;
    word-break: keep-all;
  }
  .verse .ref {
    display: inline-block;
    margin-top: 1.8rem;
    padding-top: 1.3rem;
    position: relative;
    font-family: "Gothic A1", sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--brass);
  }
  .verse .ref::before {
    content: "";
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 2.2rem; height: 1px;
    background: var(--brass);
    opacity: 0.55;
  }

  footer {
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    opacity: 0;
    animation: rise 0.9s ease 0.7s forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow, .verse, footer { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

  <div class="eyebrow">
    <div class="label">오늘의 말씀</div>
    <div class="date" id="date"></div>
  </div>

  <main class="verse">
    <p id="text"></p>
    <span class="ref" id="ref"></span>
  </main>

  <footer>DAILY WORD</footer>

<script>
  // ── 말씀 목록 ─────────────────────────────────────────
  // 이 배열만 수정하면 됩니다. { t: 본문, r: 출처 } 형식으로 추가하세요.
  // 사용하시는 번역본(개역개정·새번역 등)의 저작권 정책을 확인 후 채워 주세요.
  const VERSES = [
    { t: "여호와는 나의 목자시니 내게 부족함이 없으리로다", r: "시편 23:1" },
    { t: "수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라", r: "마태복음 11:28" },
    { t: "네 시작은 미약하였으나 네 나중은 심히 창대하리라", r: "욥기 8:7" },
    { t: "내가 네게 명령한 것이 아니냐 강하고 담대하라 두려워하지 말며 놀라지 말라", r: "여호수아 1:9" },
    { t: "너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라", r: "마태복음 6:33" },
    { t: "항상 기뻐하라 쉬지 말고 기도하라 범사에 감사하라", r: "데살로니가전서 5:16-18" },
    { t: "내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라", r: "빌립보서 4:13" },
    { t: "사랑은 오래 참고 사랑은 온유하며 시기하지 아니하며", r: "고린도전서 13:4" },
    { t: "두려워하지 말라 내가 너와 함께 함이라 놀라지 말라 나는 네 하나님이 됨이라", r: "이사야 41:10" },
    { t: "네 마음을 다하고 목숨을 다하고 뜻을 다하여 주 너의 하나님을 사랑하라", r: "마태복음 22:37" },
    { t: "너희 염려를 다 주께 맡기라 이는 그가 너희를 돌보심이라", r: "베드로전서 5:7" },
    { t: "우리가 알거니와 하나님을 사랑하는 자에게는 모든 것이 합력하여 선을 이루느니라", r: "로마서 8:28" },
    { t: "여호와를 기뻐하라 그가 네 마음의 소원을 네게 이루어 주시리로다", r: "시편 37:4" },
    { t: "너는 마음을 다하여 여호와를 신뢰하고 네 명철을 의지하지 말라", r: "잠언 3:5" },
    { t: "그런즉 믿음, 소망, 사랑, 이 세 가지는 항상 있을 것인데 그 중의 제일은 사랑이라", r: "고린도전서 13:13" }
  ];

  // ── 날짜 기준으로 오늘의 말씀 선택 (하루 동안 동일, 매일 변경) ──
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  const pick = VERSES[dayOfYear % VERSES.length];

  document.getElementById("text").textContent = pick.t;
  document.getElementById("ref").textContent = pick.r;
  document.getElementById("date").textContent =
    now.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
</script>
</body>
</html>
